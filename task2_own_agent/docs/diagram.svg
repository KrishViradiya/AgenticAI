<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b45"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf6"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#1d1d1f">Task 2 – our own coding agent</text>
  <text x="40" y="80" font-size="16" fill="#5a5a5f">agent.py: one JSON action per step · max 25 steps per round · no frameworks, no native tool calling</text>

  <!-- agent loop frame -->
  <rect x="40" y="105" width="620" height="440" rx="18" fill="#ffffff" stroke="#3b3b45" stroke-width="2"/>
  <text x="62" y="135" font-size="17" font-weight="700" fill="#1d1d1f">agent.py – the loop</text>

  <!-- messages -->
  <rect x="70" y="155" width="250" height="88" rx="12" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="195" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">Conversation</text>
  <text x="195" y="204" font-size="13" text-anchor="middle" fill="#3b3b45">system prompt + task (no style</text>
  <text x="195" y="221" font-size="13" text-anchor="middle" fill="#3b3b45">guide text) + all steps so far</text>

  <!-- model -->
  <rect x="390" y="155" width="240" height="88" rx="12" fill="#f3eefb" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="510" y="185" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">Model</text>
  <text x="510" y="207" font-size="13" text-anchor="middle" fill="#3b3b45">openai.gpt-6-luna</text>
  <text x="510" y="224" font-size="13" text-anchor="middle" fill="#3b3b45">decides the next action</text>
  <line x1="320" y1="199" x2="388" y2="199" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- parser -->
  <rect x="390" y="290" width="240" height="96" rx="12" fill="#fff6e5" stroke="#c98a14" stroke-width="1.5"/>
  <text x="510" y="316" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">Parse + validate</text>
  <text x="510" y="337" font-size="12.5" text-anchor="middle" fill="#3b3b45" font-family="Consolas, monospace">{"thought", "action", "args"}</text>
  <text x="510" y="356" font-size="13" text-anchor="middle" fill="#3b3b45">+ ```html block for write_site</text>
  <text x="510" y="374" font-size="13" text-anchor="middle" fill="#3b3b45">JSON? known action? args?</text>
  <line x1="510" y1="243" x2="510" y2="288" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- error path -->
  <line x1="390" y1="320" x2="334" y2="320" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <line x1="225" y1="283" x2="225" y2="247" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <rect x="120" y="283" width="212" height="56" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="226" y="306" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c0392b">invalid → "ERROR: …"</text>
  <text x="226" y="325" font-size="12.5" text-anchor="middle" fill="#7a2a20">sent back, counts as a step</text>

  <!-- dispatch -->
  <rect x="390" y="430" width="240" height="90" rx="12" fill="#e9f6ee" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="510" y="458" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">Run the action</text>
  <text x="510" y="480" font-size="13" text-anchor="middle" fill="#3b3b45">our code executes it and</text>
  <text x="510" y="497" font-size="13" text-anchor="middle" fill="#3b3b45">returns an observation</text>
  <line x1="510" y1="386" x2="510" y2="428" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- observation back -->
  <path d="M390,475 L95,475 L95,245" fill="none" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>
  <text x="105" y="465" font-size="13" fill="#3b3b45">observation appended</text>
  <text x="110" y="508" font-size="12.5" fill="#5a5a5f">only the newest page stays in the context;</text>
  <text x="110" y="525" font-size="12.5" fill="#5a5a5f">older pages → "[older version omitted]"</text>

  <!-- actions column -->
  <text x="720" y="128" font-size="17" font-weight="700" fill="#1d1d1f">Actions</text>

  <rect x="720" y="142" width="250" height="78" rx="12" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="736" y="168" font-size="15" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">search_style_guide</text>
  <text x="736" y="190" font-size="13" fill="#3b3b45">args: {"query": "..."}</text>
  <text x="736" y="208" font-size="13" fill="#3b3b45">→ top k = 4 chunks, ≤ 1,000 tokens</text>

  <rect x="720" y="236" width="250" height="78" rx="12" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="736" y="262" font-size="15" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">read_profiles</text>
  <text x="736" y="284" font-size="13" fill="#3b3b45">content/*.md (not _template)</text>
  <text x="736" y="302" font-size="13" fill="#3b3b45">+ list of image file names</text>

  <rect x="720" y="330" width="250" height="96" rx="12" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="736" y="356" font-size="15" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">write_site</text>
  <text x="736" y="378" font-size="13" fill="#3b3b45">reject base64 → embed {{image:…}}</text>
  <text x="736" y="396" font-size="13" fill="#3b3b45">→ save index.html</text>
  <text x="736" y="414" font-size="13" fill="#3b3b45">→ checker report (25 checks)</text>

  <rect x="720" y="442" width="250" height="78" rx="12" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="736" y="468" font-size="15" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">finish</text>
  <text x="736" y="490" font-size="13" fill="#3b3b45">accepted only if the last</text>
  <text x="736" y="508" font-size="13" fill="#3b3b45">check passed, else REJECTED</text>

  <line x1="630" y1="475" x2="700" y2="475" stroke="#3b3b45" stroke-width="2"/>
  <line x1="700" y1="181" x2="700" y2="481" stroke="#3b3b45" stroke-width="2"/>
  <line x1="700" y1="181" x2="718" y2="181" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="275" x2="718" y2="275" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="378" x2="718" y2="378" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="481" x2="718" y2="481" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- RAG -->
  <rect x="1020" y="112" width="225" height="196" rx="14" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1132" y="138" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">rag.py</text>
  <text x="1036" y="162" font-size="13" fill="#3b3b45">55 style guide docs</text>
  <text x="1036" y="182" font-size="13" fill="#3b3b45">→ 66 chunks (## sections)</text>
  <text x="1036" y="202" font-size="13" fill="#3b3b45">  header: [SG-xx] title | Status</text>
  <text x="1036" y="222" font-size="13" fill="#3b3b45">→ qwen3-embedding-8b</text>
  <text x="1036" y="242" font-size="13" fill="#3b3b45">  vectors cached in .cache/</text>
  <text x="1036" y="262" font-size="13" fill="#3b3b45">→ cosine similarity, top k</text>
  <text x="1036" y="290" font-size="12.5" fill="#2e8b57" font-weight="700">test: 18/18 rules in top 4</text>
  <line x1="970" y1="181" x2="1018" y2="181" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- checker -->
  <rect x="1020" y="330" width="225" height="96" rx="14" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="1132" y="356" font-size="16" font-weight="700" text-anchor="middle" fill="#1d1d1f">check_site (full)</text>
  <text x="1036" y="380" font-size="13" fill="#3b3b45">7 basic + 18 style guide</text>
  <text x="1036" y="398" font-size="13" fill="#3b3b45">checks; failures go back</text>
  <text x="1036" y="416" font-size="13" fill="#3b3b45">to the model</text>
  <line x1="970" y1="378" x2="1018" y2="378" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>

  <!-- human feedback -->
  <rect x="720" y="585" width="525" height="100" rx="14" fill="#fff6e5" stroke="#c98a14" stroke-width="2"/>
  <text x="740" y="614" font-size="16" font-weight="700" fill="#1d1d1f">Human in the loop</text>
  <text x="740" y="638" font-size="13.5" fill="#3b3b45">after an accepted finish: "Feedback for the agent (empty = done):"</text>
  <text x="740" y="658" font-size="13.5" fill="#3b3b45">text → new user message, new 25-step budget, must pass the checks again</text>
  <text x="740" y="678" font-size="13.5" fill="#3b3b45">empty → run ends · everything logged in logs/run_XX.jsonl</text>
  <line x1="845" y1="520" x2="845" y2="583" stroke="#3b3b45" stroke-width="2" marker-end="url(#a)"/>
  <path d="M720,622 L95,622 L95,479" fill="none" stroke="#c98a14" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="612" font-size="13" fill="#9a6a10">feedback → back into the conversation</text>

  <!-- run_02 stats -->
  <rect x="40" y="645" width="620" height="44" rx="10" fill="#1d1d1f"/>
  <text x="58" y="673" font-size="14.5" fill="#fbfaf6">run_03 (submitted): 22 steps · 17 searches · 25/25 first try · feedback → 25/25 · $0.0132</text>
</svg>
